  <text x="64" y="468" font-family="Segoe UI, Arial, sans-serif" font-weight="500" font-size="24" fill="#a7b2ba">Interactive dashboard and technical case study</text>

  <!-- Orange rule -->
  <line x1="600" y1="-10" x2="560" y2="640" stroke="#ff7049" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Real Power BI screenshot (1376×775), scaled proportionally, uncropped -->
