      <stop offset="0" stop-color="#ff7049" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff7049" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#111a20"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Monogram and label -->
  <rect x="64" y="64" width="52" height="52" rx="8" fill="none" stroke="#ff7049" stroke-width="3"/>
  <text x="90" y="99" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="21" fill="#ff7049">TB</text>
  <text x="132" y="97" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="22" fill="#a7b2ba">Tyler Brunsting</text>

  <text x="64" y="232" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="4" fill="#ff7049">SPORTS ANALYTICS CASE STUDY</text>
  <text x="64" y="302" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="60" fill="#f6f3ec">Transfer Market</text>
  <text x="64" y="372" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="60" fill="#f6f3ec">Efficiency</text>
