# Deploy the portfolio to GitHub Pages: https://tbrunsting.github.io/
#
# Runs on every push to main, or by hand from the Actions tab.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
# See docs/DEPLOYMENT.md.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # User site served from the root. Override with repository variables
          # (Settings → Secrets and variables → Actions → Variables) only for a
          # future custom domain.
          SITE_URL: ${{ vars.SITE_URL || 'https://tbrunsting.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
