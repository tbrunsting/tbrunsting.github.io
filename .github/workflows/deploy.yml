# Deploy to GitHub Pages — PREPARED, NOT ACTIVE.
#
# This workflow does nothing on its own:
#   • The site has no GitHub remote, so this file never reaches GitHub until you push.
#   • Even after pushing, it only runs when started by hand (workflow_dispatch).
#   • GitHub Pages must also be enabled in the repository settings.
#
# To switch on automatic deploys later, uncomment the `push:` trigger below.
# Step-by-step instructions: docs/DEPLOYMENT.md

name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # Optional repository *variables* (Settings → Secrets and variables → Actions → Variables).
          # Without them the defaults below are correct for GitHub Pages:
          #   • repo named <owner>.github.io  → https://<owner>.github.io/        (base '/')
          #   • any other repo name           → https://<owner>.github.io/<repo>/ (base '/<repo>')
          # Set SITE_URL (and BASE_PATH '/') only once a custom domain is owned and configured.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}', github.event.repository.name)) }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
